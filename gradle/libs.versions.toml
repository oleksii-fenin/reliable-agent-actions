[versions]
junit = "6.1.3"
assertj = "3.27.7"
postgresql = "42.7.14"
testcontainers = "2.0.5"
# Floor of the supported range (ADR-0002: findTools + tools(List<AiServiceTool>)); the adapter compiles against it.
langchain4j-floor = "1.14.0"
# Latest release checked 2026-11-16 (Maven Central); the default for the adapter tests.
langchain4j-latest = "1.23.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
langchain4j-floor = { module = "dev.langchain4j:langchain4j", version.ref = "langchain4j-floor" }
