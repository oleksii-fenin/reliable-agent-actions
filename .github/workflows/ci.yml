name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly workflow runs the same matrix (nightly.yml).
  workflow_call:
    inputs:
      rerun-tests:
        # A push may take test results from the build cache (same inputs, same result); the nightly run must not, or
        # it re-checks nothing when no commit came in.
        description: Run every task again instead of taking results from the build cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Build with the JDK 25 toolchain (bytecode --release 17), run the tests on each supported user JDK.
    name: build (tests on JDK ${{ matrix.test-java }}, ${{ matrix.postgres }}${{ matrix.langchain4j && format(', LangChain4j {0}', matrix.langchain4j) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: ['17', '21', '25']
        # PostgreSQL floor (14) and latest release (docs/DESIGN.md §7); the floor runs once, on JDK 25.
        postgres: ['postgres:18-alpine']
        include:
          - test-java: '25'
            postgres: 'postgres:14-alpine'
          # Matches the JDK 17 job and adds to it: that job tests the floors (Java 17, LangChain4j 1.14.0, ADR-0002);
          # the JDK 21 and 25 jobs test the latest LangChain4j release.
          - test-java: '17'
            postgres: 'postgres:18-alpine'
            langchain4j: '1.14.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The last version becomes JAVA_HOME (runs Gradle); every version is exported as JAVA_HOME_<v>_X64.
          java-version: |
            ${{ matrix.test-java }}
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: >
          ./gradlew build
          -PtestJavaVersion=${{ matrix.test-java }}
          -PpostgresImage=${{ matrix.postgres }}
          ${{ matrix.langchain4j && format('-Plangchain4jVersion={0}', matrix.langchain4j) || '' }}
          ${{ inputs.rerun-tests && '--rerun-tasks' || '' }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.test-java }}_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false
