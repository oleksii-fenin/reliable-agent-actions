name: Nightly

# docs/DESIGN.md §9: the randomized process kill (500 runs per policy), the full build matrix of ci.yml and the adapter
# tests on the newest LangChain4j release (Q7), also when nothing was pushed, so that drift in dependencies, runners
# or LangChain4j shows up. The pause test and the database fault tests run in every build already (ci.yml). GitHub
# disables scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: Randomized kill runs per policy (at least 20, for the coverage check)
        required: false
        default: '500'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      rerun-tests: true

  newest-langchain4j:
    # Q7 (docs/DESIGN.md §2): the adapter and the example on the newest LangChain4j release on Maven Central, not the
    # one in gradle/libs.versions.toml, so a new release is tested the night after it appears.
    name: newest LangChain4j (adapter and example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Find the newest release
        run: |
          set -euo pipefail
          # Releases only (x.y.z); the metadata also lists old alphas, betas and release candidates.
          newest=$(curl -sSf --retry 3 https://repo1.maven.org/maven2/dev/langchain4j/langchain4j/maven-metadata.xml \
            | grep -o '<version>[0-9]*\.[0-9]*\.[0-9]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          [[ "$newest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no release version found: '$newest'"; exit 1; }
          catalog=$(sed -n 's/^langchain4j-latest = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          echo "LANGCHAIN4J_NEWEST=$newest" >> "$GITHUB_ENV"
          echo "Newest LangChain4j release: $newest (gradle/libs.versions.toml: $catalog)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$newest" != "$catalog" ]; then
            echo "::notice::LangChain4j $newest is newer than langchain4j-latest $catalog in gradle/libs.versions.toml"
          fi
      - name: Adapter and example tests
        # LangChain4jContractTest checks that the tests ran on the requested version's jar.
        run: >
          ./gradlew :raa-langchain4j:test :examples:langchain4j-refund:test
          -Plangchain4jVersion="$LANGCHAIN4J_NEWEST" --rerun-tasks
          -Porg.gradle.java.installations.auto-download=false
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: newest-langchain4j
          path: |
            raa-langchain4j/build/reports/tests/test
            examples/langchain4j-refund/build/reports/tests/test

  randomized-kill:
    name: randomized kill (${{ matrix.policy }})
    runs-on: ubuntu-latest
    # About 4.5 s per run: 500 runs take about 40 minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        policy: [IDEMPOTENT_DOWNSTREAM, RECONCILABLE, AT_MOST_ONCE, AT_LEAST_ONCE]
    env:
      RUNS: ${{ inputs.runs || '500' }}
      # Every run's name carries its own seed, so a failure can be repeated locally with -PrandomizedKillSeed.
      SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the number of runs
        run: '[[ "$RUNS" =~ ^[1-9][0-9]*$ ]] && (( RUNS >= 20 )) || { echo "runs must be a number of at least 20: $RUNS"; exit 1; }'
      - name: Randomized kill
        run: >
          ./gradlew :raa-postgres:test --tests '*RandomizedKillTest'
          -PrandomizedKillRuns="$RUNS"
          -PrandomizedKillPolicies=${{ matrix.policy }}
          -PrandomizedKillSeed="$SEED"
          -Porg.gradle.java.installations.auto-download=false
      - name: Check that every run ran
        # A test that is not enabled is skipped, not failed: a green job with no runs proves nothing.
        run: |
          report=raa-postgres/build/test-results/test/TEST-io.github.oleksiifenin.raa.postgres.RandomizedKillTest.xml
          suite=$(grep -o '<testsuite [^>]*' "$report")
          ran=$(echo "$suite" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]\+')
          skipped=$(echo "$suite" | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]\+')
          # Every run plus one coverage check, none skipped.
          [ "$ran" = "$((RUNS + 1))" ] && [ "$skipped" = "0" ] \
            || { echo "expected $((RUNS + 1)) tests, none skipped; the report has ${ran:-none}, ${skipped:-?} skipped"; exit 1; }
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: randomized-kill-${{ matrix.policy }}
          path: |
            raa-postgres/build/reports/tests/test
            raa-postgres/build/test-results/test
